name: smart_farm
description: "Smart Farm AI — Production-ready Flutter application."
publish_to: none
version: 2.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── UI ──────────────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  flutter_svg:     ^2.0.10+1
  fl_chart: ^1.2.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # ── State management ────────────────────────────────────────────────────────
  provider: ^6.1.2

  # ── Networking ───────────────────────────────────────────────────────────────
  http: ^1.2.1

  # ── Storage ──────────────────────────────────────────────────────────────────
  shared_preferences: ^2.3.1
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.3
  open_filex: ^4.5.0

  # ── Image picking (AI model uploads) ────────────────────────────────────────
  image_picker: ^1.1.2
  url_launcher: ^6.3.2

  # ── Location ────────────────────────────────────────────────────────────────
  geolocator: ^14.0.2
  geocoding: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon/icon.png"
  adaptive_icon_background: "#4CAF50"
  adaptive_icon_foreground: "assets/images/app_icon/icon.png"
  web:
    generate: true
    image_path: "assets/images/app_icon/icon.png"
    background_color: "#ffffff"
    theme_color: "#4CAF50"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/icons/
    - assets/images/logo/
